server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Needed because nginx resolves a literal upstream
  # hostname exactly once, at config load, and then caches that IP forever —
  # so recreating the api container leaves nginx dialing a dead address and
  # every /api call returns 502 until nginx itself is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # nginx's bundled mime.types predates the web app manifest, so .webmanifest
  # would go out as application/octet-stream and Chrome would ignore it — the
  # app is then quietly not installable, with no error anywhere.
  #
  # Done with default_type on the one location rather than a `types` block: a
  # nested `types` REPLACES the inherited map instead of extending it, and
  # mime.types cannot be re-included inside one because it is itself a `types`
  # block. Measured: adding the obvious two-line block served html, js, css and
  # png as application/octet-stream, i.e. no stylesheet and no ES module.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control 'no-cache, must-revalidate';
    try_files $uri =404;
  }

  # The service worker is the one file that must never be served stale: a
  # cached sw.js keeps handing out the previous build's precache long after a
  # deploy, and the update prompt never appears because the browser never sees
  # a new worker.
  location = /sw.js {
    add_header Cache-Control 'no-cache, must-revalidate';
    try_files $uri =404;
  }

  # index.html is the app shell and carries no hash, so it has the same problem.
  location = /index.html {
    add_header Cache-Control 'no-cache, must-revalidate';
  }

  # Everything under /assets is content-hashed by vite: a changed file gets a
  # changed name, so it can be cached for as long as the browser likes.
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
    try_files $uri =404;
  }

  # SPA fallback.
  location / {
    try_files $uri /index.html;
  }

  # Everything /api goes to the api service.
  location /api/ {
    # Using a variable forces nginx to re-resolve on each request (honouring
    # the resolver TTL above). It also stops nginx rewriting the URI, so the
    # original path has to be passed through explicitly.
    set $api_upstream api;
    proxy_pass http://$api_upstream:8710$request_uri;

    proxy_set_header Host $host;
    proxy_read_timeout 300s;

    # SSE (/api/ask/stream) must not be buffered or chunk-collapsed, or the
    # client sees the whole answer arrive at once when the stream closes.
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
  }

  gzip on;
  gzip_types text/css application/javascript application/json font/woff2;
}
