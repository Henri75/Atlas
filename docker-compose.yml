# Atlas stack. Copy .env.example to .env first (make env).
# All host ports bind to 127.0.0.1 — this is a single-user local tool.

# Pinned so the volume prefix stops depending on the directory name. Compose
# derives the project name from the folder unless told otherwise, which means
# renaming the checkout would make it look for `<newname>_pg_data`, find
# nothing, and silently start on an empty index. The value stays `kdb` because
# that is the prefix the existing volumes already carry (kdb_pg_data,
# kdb_qdrant_data, …); changing it to `atlas` would orphan them and force a
# full reindex. It is an internal Docker namespace — the product is Atlas.
name: kdb

x-node-common: &node-common
  restart: unless-stopped
  # Ordered: committed defaults, then an optional .env that overrides them.
  # Later wins, per key. `required: false` is what lets .env be absent, which is
  # its normal state — the stack is fully configured without one.
  env_file:
    - config/atlas.defaults.env
    - path: .env
      required: false
  environment:
    CODE_ROOT: /data/code
    CLAUDE_PROJECTS_DIR: /data/claude/projects
    # Passed through so the API can turn container paths back into host paths
    # for editor deep links, and so the indexer can match Claude transcript
    # directories (which encode host paths) to the projects it discovers.
    CODE_ROOT_HOST: ${CODE_ROOT_HOST:-}
    CLAUDE_PROJECTS_HOST: ${CLAUDE_PROJECTS_HOST:-}
    # Extra project trees. A slot is active only when its _HOST var is set.
    CODE_ROOT_HOST_2: ${CODE_ROOT_HOST_2:-}
    CODE_ROOT_HOST_3: ${CODE_ROOT_HOST_3:-}
    CODE_ROOT_HOST_4: ${CODE_ROOT_HOST_4:-}
    CODE_ROOT_HOST_5: ${CODE_ROOT_HOST_5:-}
    DATABASE_URL: postgres://kdbscope:kdbscope@postgres:5432/kdbscope
    REDIS_URL: redis://redis:6379
    QDRANT_URL: http://qdrant:6333
    KDBSCOPE_API_URL: http://api:8710
    # Host-side Ollama (preferred embedder). Falls back to the bundled CPU
    # model with a loud warning when unreachable.
    OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    # Secrets, listed here rather than left to env_file so Doppler can supply
    # them. `environment:` outranks `env_file:`, and `${...}` reads the shell
    # first — so under `doppler run --` the injected value wins, without it the
    # expression resolves from the --env-file pair, and with neither it is empty,
    # which is the state Atlas runs in today (Ollama and the G2P proxy need no key).
    EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  indexer:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { SERVICE: indexer }
    <<: *node-common
    volumes:
      - '${CODE_ROOT_HOST:?set by config/atlas.defaults.env — run compose through make}:/data/code:ro'
      # Extra project trees. Each defaults to re-mounting root 1, which is inert:
      # the indexer only scans a slot when its CODE_ROOT_HOST_n is set. Compose
      # cannot express an optional mount, and an empty value is a syntax error.
      - '${CODE_ROOT_HOST_2:-${CODE_ROOT_HOST:?set by config/atlas.defaults.env — run compose through make}}:/data/code2:ro'
      - '${CODE_ROOT_HOST_3:-${CODE_ROOT_HOST:?set by config/atlas.defaults.env — run compose through make}}:/data/code3:ro'
      - '${CODE_ROOT_HOST_4:-${CODE_ROOT_HOST:?set by config/atlas.defaults.env — run compose through make}}:/data/code4:ro'
      - '${CODE_ROOT_HOST_5:-${CODE_ROOT_HOST:?set by config/atlas.defaults.env — run compose through make}}:/data/code5:ro'
      - '${CLAUDE_PROJECTS_HOST:?set by config/atlas.defaults.env — run compose through make}:/data/claude/projects:ro'
      - hf_cache:/app/.cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  api:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { SERVICE: api }
    <<: *node-common
    ports:
      - '127.0.0.1:${API_PORT:-8710}:8710'
    volumes:
      - hf_cache:/app/.cache
      # Read-only so the dashboard can report Qdrant's real disk usage. Qdrant
      # has no API for it (its telemetry `disk_usage_bytes` reports 0), and
      # mounting the volume is far safer than handing the API a Docker socket.
      - qdrant_data:/qdrant-storage:ro
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8710/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_started }

  mcp:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      args: { SERVICE: mcp }
    <<: *node-common
    ports:
      - '127.0.0.1:${MCP_PORT:-8711}:8711'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8711/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      api: { condition: service_healthy }

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${UI_PORT:-8712}:80'
    depends_on:
      api: { condition: service_healthy }

  qdrant:
    image: qdrant/qdrant:v1.18.2@sha256:75eab8c4ba42096724fdcfde8b4de0b5713d529dde32f285a1f86fdcb2c9e50c
    restart: unless-stopped
    environment:
      # io_uring for the on-disk vector reads. The collection keeps its fp32
      # originals memory-mapped (see VECTORS in packages/core/src/qdrant.ts) and
      # only the int8 copy in RAM, which means every search rescores its top
      # candidates by reading from disk. This is the setting Qdrant provides for
      # precisely that shape — parallel async reads instead of serial blocking
      # ones — and it buys speed without buying back any memory, which is the
      # order of priorities this stack is tuned for.
      #
      # Needs Linux 5.11+; the OrbStack VM runs 7.0. On a kernel without
      # io_uring Qdrant logs a warning and falls back to the blocking path, so
      # this is safe to leave on unconditionally.
      QDRANT__STORAGE__ASYNC_SCORER: 'true'
      # ⚠️ DO NOT ADD QDRANT__STORAGE__LOW_MEMORY_MODE HERE.
      # It is the right lever in DeepCast and Lycos and the WRONG one here.
      # `no_resident` loads quantization "as if always_ram = false", and this
      # collection sets `always_ram: true` on purpose (QUANTIZATION in
      # packages/core/src/qdrant.ts): the int8 copy in RAM plus the fp32
      # originals on disk IS the design. The mode would silently undo the half
      # of the 2026-07-30 memory work that this stack actually depends on.
      # The equivalent saving here comes from segment count instead — see
      # OPTIMIZERS.max_segment_size, where a units bug had the collection at 23
      # segments and 386 MB of fixed null-index padding.
    # 60s. There was NO stop_grace_period, so docker's default 10s applied —
    # the condition that cost Lycos ~1,085 points on 2026-08-01, when a SIGKILL
    # landed mid-flush and the log warned "Mutable ID tracker mappings and
    # versions count mismatch ... assuming automatic recovery by WAL".
    # This store is far smaller (1.4 GB / 560k points), so 60s is generous
    # rather than marginal, and it costs a healthy stop nothing — docker
    # returns as soon as the process exits.
    stop_grace_period: 60s
    # NO limit existed here at all, on a box shared with the DeepCast stack.
    # That is what makes an unbounded service dangerous: it cannot be OOM-killed
    # for its own overrun, so the VM-wide killer picks a different victim and
    # the real offender stays invisible.
    #
    # `memswap_limit` is memory+swap COMBINED, so 4g + 6g = a 2g swap cushion.
    # The two MUST move together: omit memswap_limit and docker grants swap
    # equal to memory, quietly authorising 8g.
    #
    # This is a SAFETY BOUND, not a target — a cgroup limit is not a
    # reservation and does not by itself reduce usage. Measured steady state is
    # well under 1 GB (~360 MB resident at 376k points on 2026-07-30, plus the
    # payload index, which the max_segment_size fix cuts by ~250 MB). The
    # headroom is for optimizer passes: the 2026-07-30 mass storage conversion
    # peaked at 5.65 GiB before `max_optimization_threads: 2` bounded it, so a
    # future bulk re-embed or `ensureStorageLayout` conversion is the one thing
    # that could press this. Raise it for that pass rather than living high.
    mem_limit: 4g
    memswap_limit: 6g
    ports:
      - '127.0.0.1:${QDRANT_PORT:-6363}:6333'
      - '127.0.0.1:${QDRANT_GRPC_PORT:-6364}:6334'
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6390}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18.4@sha256:22c89fe0d0f507606260237fd55e51f6137f58b2d5bcf6152242b96d9fe8f9a4
    restart: unless-stopped
    environment:
      POSTGRES_USER: kdbscope
      POSTGRES_PASSWORD: kdbscope
      POSTGRES_DB: kdbscope
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5460}:5432'
    volumes:
      # PG18 image convention: mount the parent dir (data lives in a subdir,
      # which keeps future pg_upgrade --link possible).
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kdbscope']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  qdrant_data:
  redis_data:
  pg_data:
  hf_cache:
